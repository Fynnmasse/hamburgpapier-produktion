<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Vorschau · Produktionsseite im Shop-Rahmen</title>
    <!--
        Lokale Vorschau: lädt das echte Theme-CSS des Shops und baut die Hüllen
        einer Erlebniswelt nach (volle Breite, ThemeWare-Element), damit der Block
        unter denselben Bedingungen läuft wie im Shop.

        Start:  node shopware/vorschau-server.mjs
        Dann:   http://localhost:8765/shopware/vorschau.html
        Zusätze: ?sticky=1  Header läuft auch am Desktop mit
                 ?stub=1    für automatische Tests (ersetzt Animations-Takt und Sichtbarkeits-Beobachter)

        Die Adresse des Theme-CSS ändert sich, wenn das Theme im Shop neu
        kompiliert wird. Wirkt die Vorschau unformatiert: im Shop den Quelltext
        öffnen, nach „all.css" suchen und die Adresse unten ersetzen.
    -->
    <link rel="stylesheet" href="https://www.hamburgpapier-shop.de/theme/5178f013b047ec54ae37034556ad3858/css/all.css?1793975859">
    <style>
        .vorschau-header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 185px;
            border-bottom: 1px solid #e3e6e9;
            background: #ffffff;
            color: #6b7885;
            font: 600 14px/1.4 "Open Sans", sans-serif;
        }
        .vorschau-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 480px;
            background: #0a2d47;
            color: #ffffff;
            font: 600 14px/1.4 "Open Sans", sans-serif;
        }
        @media (max-width: 991px) {
            .vorschau-header { position: sticky; top: 0; z-index: 1020; height: 60px; }
        }
        .vorschau-sticky .vorschau-header { position: sticky; top: 0; z-index: 1020; height: 60px; }
    </style>
</head>
<body class="is-ctl-navigation themeware twt-modern twt-header-type-1 twt-full-width-boxed twt-is-cms-landingpage twt-cms-styling">
    <header class="header-main vorschau-header">Shop-Header (Platzhalter)</header>

    <main class="content-main" id="content-main">
        <div class="container-main">
            <div class="cms-page">
                <div class="cms-sections">
                    <div class="cms-section pos-0 cms-section-default">
                        <section class="cms-section-default full-width">
                            <div class="cms-block pos-0 cms-block-text position-relative">
                                <div>
                                    <div class="cms-block-container">
                                        <div class="cms-block-container-row row cms-row">
                                            <div class="col-12">
                                                <div class="cms-element-twt-custom-code element twt-cms-element" id="vorschau-mount"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="vorschau-footer">Shop-Footer (Platzhalter)</footer>

    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            if (params.get('sticky') === '1') { document.body.classList.add('vorschau-sticky'); }

            if (params.get('reduced') === '1') {
                /* Test: so tun, als hätte der Besucher „Bewegung reduzieren" eingestellt (nur für das Skript) */
                var realMatchMedia = window.matchMedia.bind(window);
                window.matchMedia = function (query) {
                    if (/prefers-reduced-motion/.test(query)) {
                        return { matches: true, media: query, addEventListener: function () {}, removeEventListener: function () {}, addListener: function () {}, removeListener: function () {} };
                    }
                    return realMatchMedia(query);
                };
            }

            if (params.get('stub') === '1') {
                /* Für automatische Tests in einem nicht sichtbaren Fenster: dort laufen
                   weder requestAnimationFrame noch IntersectionObserver noch Übergänge. */
                var still = document.createElement('style');
                still.textContent = '.hpp *, .hpp *::before, .hpp *::after { transition: none !important; animation-duration: 0s !important; animation-delay: 0s !important; }';
                document.head.appendChild(still);
                window.requestAnimationFrame = function (callback) {
                    return window.setTimeout(function () { callback(performance.now()); }, 16);
                };
                window.cancelAnimationFrame = function (handle) { window.clearTimeout(handle); };
                window.IntersectionObserver = function (callback) {
                    var self = this;
                    this.observe = function (target) {
                        window.setTimeout(function () {
                            callback([{ target: target, isIntersecting: true, intersectionRatio: 1 }], self);
                        }, 30);
                    };
                    this.unobserve = function () {};
                    this.disconnect = function () {};
                };
            }

            /* Prüfwerkzeug: window.__hppAudit() meldet Überläufe, abgeschnittene Texte und Kernmaße */
            window.__hppAudit = function () {
                var root = document.getElementById('hpp-produktion');
                if (!root) { return { error: 'Block fehlt' }; }
                var cw = document.documentElement.clientWidth;
                var vh = window.innerHeight;
                var name = function (el) { return (el.className && el.className.toString().split(' ')[0]) || el.tagName.toLowerCase(); };
                var rect = function (sel) { var el = root.querySelector(sel); return el ? el.getBoundingClientRect() : null; };
                var px = function (sel, prop) { var el = root.querySelector(sel); return el ? Math.round(parseFloat(getComputedStyle(el)[prop]) * 10) / 10 : null; };
                var lines = function (sel) { var el = root.querySelector(sel); if (!el) { return null; } return Math.round(el.getBoundingClientRect().height / parseFloat(getComputedStyle(el).lineHeight)); };
                var perRow = function (sel) {
                    var tops = Array.prototype.slice.call(root.querySelectorAll(sel)).map(function (el) { return Math.round(el.getBoundingClientRect().top); });
                    return tops.filter(function (t) { return t === tops[0]; }).length;
                };
                var out = { size: window.innerWidth + 'x' + vh, mode: root.className.replace(/^hpp\s*/, ''), hscroll: document.documentElement.scrollWidth - cw };

                var outside = [];
                var clipped = [];
                Array.prototype.forEach.call(root.querySelectorAll('*'), function (el) {
                    var inTrack = !!el.closest('.hpp-slider__track');
                    var r = el.getBoundingClientRect();
                    if (!r.width || !r.height) { return; }
                    if (!inTrack && (r.right > cw + 1 || r.left < -1)) {
                        outside.push(name(el) + ' ' + Math.round(r.left) + '..' + Math.round(r.right));
                    }
                    if (/^(H1|H2|H3|P|LI|A|BUTTON|SPAN|DIV)$/.test(el.tagName) && el.children.length < 6 && el.scrollWidth > el.clientWidth + 1
                        && getComputedStyle(el).overflowX === 'visible' && getComputedStyle(el).display !== 'inline' && !el.classList.contains('hpp-slider__track')) {
                        clipped.push(name(el) + ' ' + el.scrollWidth + '>' + el.clientWidth);
                    }
                });
                out.outside = outside.slice(0, 8);
                out.clipped = clipped.slice(0, 8);

                var hero = rect('.hpp-hero');
                out.hero = {
                    h: Math.round(hero.height),
                    fold: Math.round(hero.bottom + window.pageYOffset - vh),
                    videoH: Math.round(rect('.hpp-hero__media').height),
                    title: px('.hpp-hero__title', 'fontSize') + 'px/' + lines('.hpp-hero__title') + 'Z',
                    lead: lines('.hpp-hero__lead') + 'Z'
                };
                out.intro = { w: Math.round(rect('.hpp-intro').width), h2: px('.hpp-band__title', 'fontSize') + 'px/' + lines('.hpp-band__title') + 'Z' };

                var slide = rect('.hpp-slide');
                var viewport = rect('.hpp-slider__viewport');
                out.slider = {
                    bandW: Math.round(rect('.hpp-band').width),
                    slideW: Math.round(slide.width),
                    slideH: Math.round(slide.height),
                    firstLeft: Math.round(slide.left),
                    containerLeft: Math.round(rect('.hpp-band__title').left),
                    visible: Math.round((viewport.width / (slide.width + 20)) * 10) / 10,
                    count: root.querySelector('.hpp-slider__count').textContent.trim()
                };
                out.about = { cols: perRow('.hpp-feature'), featureW: Math.round(rect('.hpp-feature').width), offerCols: perRow('.hpp-checklist li'), offerH: Math.round(rect('.hpp-offer').height) };
                var aside = rect('.hpp-faq__aside');
                var acc = rect('.hpp-acc');
                out.faq = { sideBySide: Math.abs(aside.top - acc.top) < 4, accW: Math.round(acc.width), qW: Math.round(rect('.hpp-acc__question').width), asidePos: getComputedStyle(root.querySelector('.hpp-faq__aside')).position };
                out.total = Math.round(root.getBoundingClientRect().height);
                return out;
            };

            fetch('produktion-erlebniswelt.html', { cache: 'no-store' })
                .then(function (response) { return response.text(); })
                .then(function (html) {
                    /* createContextualFragment führt die enthaltenen Skripte aus – wie im Shop */
                    var fragment = document.createRange().createContextualFragment(html);
                    document.getElementById('vorschau-mount').appendChild(fragment);
                });
        })();
    </script>
</body>
</html>
